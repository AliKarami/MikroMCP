# RouterOS CHR for the integration test suite (test/integration/).
#
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:integration
#   docker compose -f docker-compose.test.yml down
#
# The image boots the official CHR disk image inside QEMU. With /dev/kvm the
# router is ready in well under a minute; without it (e.g. Docker Desktop on
# macOS) remove the kvm device below and expect a slow emulated boot.
# Image pin must match the services in .github/workflows/integration.yml.
x-chr: &chr
  image: mnazarenko/docker-routeros:7.23.2
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun
    - /dev/kvm

services:
  chr:
    <<: *chr
    ports:
      # Loopback-only: the test router carries a well-known password.
      - "127.0.0.1:18080:80" # RouterOS REST API (plain HTTP, available since ROS 7.9)
      - "127.0.0.1:12222:22" # SSH

  # Second router for fleet/pair tests. Opt-in:
  #   docker compose -f docker-compose.test.yml --profile pair up -d
  #   MIKROMCP_ITEST_PAIR=1 npm run test:integration
  chr2:
    <<: *chr
    profiles: ["pair"]
    ports:
      - "127.0.0.1:18081:80"
      - "127.0.0.1:12223:22"
